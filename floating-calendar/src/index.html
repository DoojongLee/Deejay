<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
    <title>Floating Calendar</title>
    <style>
      :root {
        --bar: #202124;
        --bar-fg: #e8eaed;
        --accent: #8ab4f8;
        --btn-hover: #3c4043;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        background: var(--bar);
        overflow: hidden;
        font-family: "Segoe UI", system-ui, -apple-system, "Malgun Gothic", sans-serif;
        user-select: none;
      }
      #app { display: flex; flex-direction: column; height: 100vh; }

      /* 상단 바 (드래그 영역) */
      #titlebar {
        -webkit-app-region: drag;
        display: flex;
        align-items: center;
        height: 36px;
        padding: 0 6px 0 10px;
        background: var(--bar);
        color: var(--bar-fg);
        border-bottom: 1px solid #000;
        flex: 0 0 auto;
      }
      #title {
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: .2px;
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1 1 auto;
        white-space: nowrap;
        overflow: hidden;
      }
      #title .dot { color: var(--accent); }

      .controls { -webkit-app-region: no-drag; display: flex; align-items: center; gap: 2px; }
      button.tb {
        -webkit-app-region: no-drag;
        width: 28px; height: 26px;
        border: none; border-radius: 6px;
        background: transparent; color: var(--bar-fg);
        font-size: 14px; line-height: 1; cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center;
      }
      button.tb:hover { background: var(--btn-hover); }
      button.tb.active { color: var(--accent); }
      button.tb.close:hover { background: #d33; color: #fff; }

      /* 캘린더 */
      webview { flex: 1 1 auto; width: 100%; border: none; background: #fff; }

      #loading {
        position: absolute; inset: 36px 0 0 0;
        display: flex; align-items: center; justify-content: center;
        color: #9aa0a6; font-size: 13px; background: var(--bar);
        pointer-events: none; transition: opacity .25s; z-index: 2;
      }
      #loading.hidden { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="titlebar">
        <div id="title"><span class="dot">●</span> 내 구글 캘린더</div>
        <div class="controls">
          <button class="tb" id="btn-opacity-down" title="더 투명하게">▽</button>
          <button class="tb" id="btn-opacity-up" title="더 진하게">△</button>
          <button class="tb" id="btn-reload" title="새로고침">⟳</button>
          <button class="tb active" id="btn-pin" title="항상 위에 고정">📌</button>
          <button class="tb" id="btn-hide" title="트레이로 숨기기">—</button>
          <button class="tb close" id="btn-close" title="종료">✕</button>
        </div>
      </div>

      <webview
        id="cal"
        src="https://calendar.google.com/calendar/r"
        partition="persist:gcal"
        allowpopups
      ></webview>

      <div id="loading">캘린더를 불러오는 중…</div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
